name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build static binary
        run: |
          make static
          strip bbf
          file bbf
          ./bbf --help || true

      - name: Package
        run: |
          VERSION="${RELEASE_TAG:-${GITHUB_REF_NAME//\//-}}"
          PKG="bbf-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${PKG}"
          cp bbf README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          cp bbf "dist/bbf-linux-${{ matrix.arch }}"
          (cd dist && sha256sum "${PKG}.tar.gz" "bbf-linux-${{ matrix.arch }}" > "${PKG}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbf-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bbf-linux-*

  release:
    name: Publish Release
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

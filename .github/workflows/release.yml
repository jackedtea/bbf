name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag (e.g. v1.0.0). Leave empty to auto-tag from commit id.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build static binary
        run: |
          make static
          strip bbf
          file bbf
          ./bbf --help || true

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          PKG="bbf-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${PKG}"
          cp bbf README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          cp bbf "dist/bbf-linux-${{ matrix.arch }}"
          (cd dist && sha256sum "${PKG}.tar.gz" "bbf-linux-${{ matrix.arch }}" > "${PKG}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bbf-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/bbf-linux-*

  release:
    name: Publish Release
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(needs.prepare.outputs.tag, 'build-') }}
          files: dist/*
          generate_release_notes: true
